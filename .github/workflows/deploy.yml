name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # GitHub Actions 偶发 artifact 上传成功但 metadata API 尚未可见（Found 0 artifact(s)），
      # 等 15 秒再部署，避免 deploy-pages 抢跑。
      - name: Wait for artifact metadata
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
